[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgreplkit"
version = "1.1.0"
description = "Automate and de-risk PostgreSQL logical replication for blue-green deployments (RDS/Aurora aware)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "luodonghua" }]
keywords = ["postgresql", "logical-replication", "blue-green", "rds", "aurora", "migration"]

dependencies = [
    "typer>=0.12",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "rich>=13.7",
    "boto3>=1.34",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[rds]>=1.34",
    "types-PyYAML>=6.0",
]

[project.scripts]
pgreplkit = "pgreplkit.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pgreplkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL (Docker) — deselect with -m 'not integration'",
    "managed: requires live RDS/Aurora (AWS) — deselect with -m 'not managed'",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# typer's idiomatic API uses function calls (Option/Argument) as parameter defaults.
"src/pgreplkit/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["pgreplkit"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
